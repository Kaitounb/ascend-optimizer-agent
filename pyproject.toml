[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascend-optimizer-agent"
version = "0.2.0"
description = "Evidence-driven Triton-Ascend operator optimization agent"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ascend-opt = "ascend_optimizer.cli:main"

[tool.setuptools.packages.find]
include = ["ascend_optimizer*"]

[tool.setuptools.package-data]
ascend_optimizer = ["project_sources/*.py", "project_sources/*.json"]

[project.urls]
Repository = "https://github.com/Kaitounb/ascend-optimizer-agent"
Documentation = "https://github.com/Kaitounb/ascend-optimizer-agent#readme"
